---
name: "Update Hauler manifest"

on:
  workflow_dispatch:
  schedule:
    # Run this job every Monday and Wednesday at 00:00 UTC
    - cron: "0 0 * * 1,3"

concurrency:
  group: update-hauler-manifest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hauler-manifest:
    name: Update Hauler manifest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli Binary
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0
        with:
          # The cosign signature covers the exact bytes of the copied files. A
          # new updatecli release could change how the file resources read or
          # write content.
          version: v0.123.0

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: source-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          # Must match source.repository in updatecli/values.d/hauler-manifest.yaml
          repositories: suse-security
          permission-contents: read

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: target-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run Updatecli to update the Hauler manifest
        run: >-
          updatecli apply
          --config updatecli/update-hauler-manifest.yaml
          --values updatecli/values.d/hauler-manifest.yaml
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
